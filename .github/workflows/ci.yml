name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels its older run; every commit on main keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/AlgoService
    steps:
      - uses: actions/checkout@v7

      # Same Python as the algoservice image.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            src/AlgoService/requirements.txt
            src/AlgoService/requirements-dev.txt

      # Graphviz for the Petri-net rendering test.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Tests that need ProM4Py skip, as without docker locally.
      - name: Run tests
        run: python -m pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # Same Node as the frontend image.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # en.json and de.json alike, and every key the code names exists.
      - name: Check translations
        run: npm run check:i18n

      - name: Unit tests
        run: npm test

      # Next.js build cache, keyed on the lock file and the sources (not node_modules).
      - uses: actions/cache@v6
        with:
          path: src/frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}-${{ hashFiles('src/frontend/app/**', 'src/frontend/components/**', 'src/frontend/lib/**', 'src/frontend/public/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}-

      - name: Build
        run: npx next build

  # The UI in a browser against a backend without ProM, PostgreSQL or Redis: uvicorn on SQLite
  # with dataset jobs in-process, and the standalone Next.js server as in the frontend image.
  # Specs tagged @prom need ProM and run only against the Docker stack (README, "Tests").
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Next.js bakes the target of its /api rewrite into the build.
      INTERNAL_API_URL: http://127.0.0.1:8000
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/AlgoService/requirements.txt

      - name: Install backend dependencies
        working-directory: src/AlgoService
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - uses: actions/cache@v6
        with:
          path: src/frontend/.next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}-${{ hashFiles('src/frontend/app/**', 'src/frontend/components/**', 'src/frontend/lib/**', 'src/frontend/public/**') }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}-

      - name: Build the frontend
        working-directory: src/frontend
        run: |
          npx next build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}

      - name: Install Chromium
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      # PROM4PY_URL keeps its default, where nothing listens, so ComFy finds no ProM; it waits
      # 2 s for one instead of 3 minutes.
      - name: Start the backend
        working-directory: src/AlgoService
        env:
          TESTING: "1"
          TEST_DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/e2e.db
          RATE_LIMIT_DISABLED: "1"
          ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
          UPLOADED_LOGS_DIR: ${{ runner.temp }}/uploads
          PROM4PY_START_WAIT: "2"
        run: |
          nohup python -m uvicorn srv_main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/backend.log"; exit 1

      - name: Start the frontend
        working-directory: src/frontend/.next/standalone
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 nohup node server.js > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:3000/api/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/frontend.log"; exit 1

      - name: Run the end-to-end tests
        working-directory: src/frontend
        run: npx playwright test

      - name: Server logs
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/frontend.log"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            src/frontend/playwright-report
            src/frontend/test-results
          retention-days: 7

  # Only the stage that compiles the lp_solve JNI wrapper; the full prom4py image downloads
  # the 430 MB ProM bundle.
  prom4py-lpsolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the lp_solve wrapper
        run: docker build --target lpsolve-wrapper -t lpsolve-wrapper src/prom4py

      - name: Check that the wrapper finds its libraries
        run: docker run --rm lpsolve-wrapper sh -c 'ldd liblpsolve55j.so && ! ldd liblpsolve55j.so | grep -q "not found"'
