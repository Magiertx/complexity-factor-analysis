name: Images

# Builds the three images of the stack (prom4py, algoservice, frontend) and pushes them to
# ghcr.io, so the tool starts without a local build (docker-compose.release.yml). A v* tag
# without a suffix also tags the images latest and drafts a GitHub release with the compose file. Started by
# hand with a tag such as edge to try it without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push
        default: edge
      platforms:
        description: Platforms to build (linux/amd64,linux/arm64 builds under emulation and is slow)
        default: linux/amd64

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: prom4py
            context: src/prom4py
          - service: algoservice
            context: src/AlgoService
          - service: frontend
            context: src/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Tags and version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          SERVICE: ${{ matrix.service }}
        run: |
          # Registry names are lowercase; the owner of the repository is not.
          image="ghcr.io/magiertx/complexity-factor-analysis-${SERVICE}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            # A suffix such as -rc1 marks a pre-release; only plain tags move latest.
            case "$tag" in
              *-*) tags="${image}:${tag}" ;;
              *) tags="${image}:${tag},${image}:latest" ;;
            esac
            version="${tag#v}"
          else
            tag="${INPUT_TAG:-edge}"
            tags="${image}:${tag}"
            if [ "$tag" = edge ]; then version="1.0.0-dev"; else version="${tag#v}"; fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "platforms=${INPUT_PLATFORMS:-linux/amd64}" >> "$GITHUB_OUTPUT"
          echo "$tags (version $version)"

      - uses: docker/setup-qemu-action@v3
        if: contains(steps.meta.outputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # APP_VERSION and APP_COMMIT end up in the manifest of every export (see
      # docs/DEPLOYMENT.md). Only the algoservice Dockerfile declares them; the other two
      # ignore the arguments.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # A draft, so the notes and the assets can be checked before the release goes out.
  release:
    if: github.ref_type == 'tag'
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Draft the release with the compose file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub renames a leading dot in an asset name, so the example goes up as env.example.
          cp .env.example env.example
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" docker-compose.release.yml env.example --clobber
          else
            gh release create "$GITHUB_REF_NAME" docker-compose.release.yml env.example \
              --draft $pre --title "$GITHUB_REF_NAME" --generate-notes
          fi
