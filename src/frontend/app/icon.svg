<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="XCom">
  <!-- The XCom logo: a 5 x 5 heat map like the loading matrix, whose strong cells form the X.
       Source of the favicon and, via src/desktop/assets/make_icons.mjs, of the desktop icons;
       components/app-logo.tsx draws the same picture inline. -->
  <rect width="64" height="64" rx="14" fill="#111827"/>
  <g fill="#e11d48">
    <rect x="8" y="8" width="8" height="8" rx="1.6"/>
    <rect x="48" y="8" width="8" height="8" rx="1.6"/>
    <rect x="18" y="18" width="8" height="8" rx="1.6"/>
    <rect x="38" y="18" width="8" height="8" rx="1.6"/>
    <rect x="28" y="28" width="8" height="8" rx="1.6"/>
    <rect x="18" y="38" width="8" height="8" rx="1.6"/>
    <rect x="38" y="38" width="8" height="8" rx="1.6"/>
    <rect x="8" y="48" width="8" height="8" rx="1.6"/>
    <rect x="48" y="48" width="8" height="8" rx="1.6"/>
  </g>
  <g fill="#60a5fa">
    <rect x="18" y="8" width="8" height="8" rx="1.6" opacity=".10"/>
    <rect x="28" y="8" width="8" height="8" rx="1.6" opacity=".08"/>
    <rect x="38" y="8" width="8" height="8" rx="1.6" opacity=".08"/>
    <rect x="8" y="18" width="8" height="8" rx="1.6" opacity=".07"/>
    <rect x="28" y="18" width="8" height="8" rx="1.6" opacity=".07"/>
    <rect x="48" y="18" width="8" height="8" rx="1.6" opacity=".14"/>
    <rect x="8" y="28" width="8" height="8" rx="1.6" opacity=".08"/>
    <rect x="18" y="28" width="8" height="8" rx="1.6" opacity=".11"/>
    <rect x="38" y="28" width="8" height="8" rx="1.6" opacity=".10"/>
    <rect x="48" y="28" width="8" height="8" rx="1.6" opacity=".17"/>
    <rect x="8" y="38" width="8" height="8" rx="1.6" opacity=".15"/>
    <rect x="28" y="38" width="8" height="8" rx="1.6" opacity=".08"/>
    <rect x="48" y="38" width="8" height="8" rx="1.6" opacity=".07"/>
    <rect x="18" y="48" width="8" height="8" rx="1.6" opacity=".08"/>
    <rect x="28" y="48" width="8" height="8" rx="1.6" opacity=".13"/>
    <rect x="38" y="48" width="8" height="8" rx="1.6" opacity=".10"/>
  </g>
</svg>
